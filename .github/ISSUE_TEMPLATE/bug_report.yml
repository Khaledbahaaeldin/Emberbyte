name: Bug report
description: Something in Emberbyte does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Emberbyte keeps all your data on your phone, so **please do not attach a backup file, an export or screenshots that show personal data**. Describing what you see is enough.
  - type: input
    id: version
    attributes:
      label: Emberbyte version
      description: Settings, then About, or the GitHub Release you installed.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Galaxy S24+, Android 16 (One UI 8.5)"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install it from?
      options:
        - GitHub Releases
        - F-Droid
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, in order, that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach a backup file, an export or any personal data.
          required: true
